name: CI (Storage Test Suite)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'readme/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test
