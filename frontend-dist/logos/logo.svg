<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: url(#gradLight); }
    .fg { fill: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -0.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#gradDark); }
      .fg { fill: #09090b; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <text class="fg" x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">TN</text>
</svg>
